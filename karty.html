/* =========================== POMOCNICZE =========================== */
function esc(s){return String(s==null?'':s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}
function lum(hex){
  const r=parseInt(hex.slice(1,3),16)/255, g=parseInt(hex.slice(3,5),16)/255, b=parseInt(hex.slice(5,7),16)/255;
  return 0.2126*r + 0.7152*g + 0.0722*b;
}
const ink  = hex => lum(hex) > 0.55 ? '#111111' : '#FFFFFF';   /* tekst na pasku */
const numc = hex => lum(hex) > 0.60 ? '#111111' : hex;         /* cyfra w ikonce */

function amt(v, cls){return `<span class="amt ${cls||''}"><svg class="m" viewBox="0 0 120 82"><use href="#m-glyph"/></svg><b>${v}</b></span>`}
function badge(v, cls){
  if(v===null) return `<div class="badge badge--none ${cls||''}"><b>BEZ<br>WART.</b></div>`;
  return `<div class="badge ${cls||''}"><svg class="m" viewBox="0 0 120 82"><use href="#m-glyph"/></svg><b>${v}</b></div>`;
}
function nameCls(n){return n.length > 17 ? 'sm' : ''}
function embSize(n){const L=n.length; return L<=9?6:L<=14?5:L<=20?4.2:L<=30?3.6:3.1}

/* wachlarz ikonek: karta z cyfrą na wierzchu, pozostałe w prawo i w górę */
function fan(n, full){
  let s='';
  for(let i=n-1;i>=1;i--){
    s+=`<div class="fan__card" style="transform:translate(${(1.6*i).toFixed(2)}mm,${(-0.9*i).toFixed(2)}mm) rotate(${-7*i}deg);z-index:${9-i}">
      <div class="fan__bar"></div></div>`;
  }
  s+=`<div class="fan__card" style="z-index:9"><div class="fan__bar"></div><div class="fan__num">${n}</div></div>`;
  if(full) s+=`<svg class="sparks" viewBox="0 0 5 6"><g stroke="#111" stroke-width=".45" stroke-linecap="round">
    <line x1=".6" y1="1.4" x2="2.2" y2=".4"/><line x1="1" y1="3" x2="2.8" y2="3"/>
    <line x1=".6" y1="4.6" x2="2.2" y2="5.6"/></g></svg>`;
  return `<div class="fan">${s}</div>`;
}

function rentLadder(key, mini){
  const s=SETS[key], n=s.size;
  const pitch = mini ? (n>3?6.6:n>2?8.2:10) : (n>3?8.5:11);
  let rows='';
  s.rents.forEach((r,i)=>{
    rows+=`<li class="rent-row" style="--pitch:${pitch}mm">${fan(i+1, i===n-1)}<span class="rent">${amt(r)}</span></li>`;
  });
  return `<div class="body"><ol class="rent-list">${rows}</ol>
    ${mini?'':'<p class="complete-set">Komplet</p>'}</div>`;
}

function setVars(key){
  const s=SETS[key];
  return `--set:${s.c};--set-ink:${ink(s.c)};--set-num:${numc(s.c)}`;
}

      <header class="band"><h2>${esc(name)}</h2></header>
      ${badge(s.val,'badge--prop')}
      <div class="cols">
        <span class="col-head col-head--left">Karty<br>w kolorze</span>
        <span class="col-head col-head--right">Czynsz</span>
      </div>
      ${rentLadder(key)}
      <p class="flavor">${esc(flavor)}</p>
    </div>
  </article>`;
}

function wildCard([a,b,v,q,name]){
  const half=(key,cls)=>`<div class="half half--${cls}" style="${setVars(key)}">
      <header class="band"><h2 class="${nameCls(name)}">${esc(name)}</h2></header>
      ${badge(v)}
      ${rentLadder(key,true)}
    </div>`;
  return `<article class="card card--wild2" data-t="wild">
    <div class="key">
      ${half(a,'a')}
      <div class="wild-divider"><span>Czytaj z dwóch stron</span></div>
      ${half(b,'b')}
    </div>
  </article>`;
}

function wildAllCard(){
  const stops=['#E1231C','#F08A24','#F5E23A','#17A24A','#00C2C7','#0069B4','#7A1FA2','#D5286E'];
  const grad=stops.map((c,i)=>`<stop offset="${(i/(stops.length-1)*100).toFixed(0)}%" stop-color="${c}"/>`).join('');
  return `<article class="card card--wildall" data-t="wild">
    <div class="key">
      <div class="wildall">
        <svg class="title" viewBox="0 0 200 80">
          <defs><linearGradient id="rainbow" x1="0" y1="0" x2="1" y2="0">${grad}</linearGradient></defs>
          <text x="100" y="34" text-anchor="middle" font-family="Poppins,sans-serif" font-size="34"
            font-weight="900" fill="url(#rainbow)" rotate="-4 4 -3 3 -4">JOKER</text>
          <text x="100" y="68" text-anchor="middle" font-family="Poppins,sans-serif" font-size="20"
            font-weight="900" fill="url(#rainbow)" rotate="3 -3 4 -4 3 -3 4 -3 3 -4 4 -3 3">${esc(WILD_ALL.n.toUpperCase())}</text>
        </svg>
        <p>${esc(WILD_ALL.t)}</p>
        <div class="mascot"><img src="bartek.png" alt="Goraj"></div>
      </div>
      ${badge(null)}
    </div>
  </article>`;
}

function moneyCard([v,q,color]){
  return `<article class="card card--money" data-t="money" style="--money:${color}">
    <div class="key">
      <div class="dots"></div>
      ${v===10?'<div class="rays" style="border-radius:50%;background:repeating-conic-gradient(#fff 0 11.25deg,transparent 11.25deg 22.5deg)"></div>':''}
      <span class="money-corner money-corner--tl">${amt(v)}</span>
      <span class="money-corner money-corner--br">${amt(v)}</span>
      <div class="coin">${amt(v)}</div>
      <div class="money-band">GORIPOLY</div>
    </div>
  </article>`;
}

function actionCard(a, type){
  return `<article class="card card--action" data-t="${type}" style="--c:${a.c}">
    <div class="key">
      <div class="chevron"></div>
      <span class="action-tag">${type==='oops'?'Przypał':'Akcja'}</span>
      <div class="emblem">
        <svg viewBox="0 0 100 100"><use href="#ico-${a.ico}"/></svg>
        <b style="--nsize:${embSize(a.n)}mm">${esc(a.n)}</b>
      </div>
      <p class="effect">${esc(a.t)}<i>${esc(a.f)}</i></p>
    </div>
    ${badge(a.v,'badge--action')}
  </article>`;
}

function rentCard(r){
  const all = r.all;
  const halves = all
    ? `<div class="h" style="flex:1;background:conic-gradient(${Object.keys(SETS).map((k,i)=>`${SETS[k].c} ${i*36}deg ${(i+1)*36}deg`).join(',')})"></div>`
    : `<div class="h" style="background:${SETS[r.a].c}"></div><div class="h" style="background:${SETS[r.b].c}"></div>`;
  const eff = all
    ? 'Jeden wybrany gracz płaci Ci czynsz za nieruchomości w jednym dowolnym kolorze.'
    : 'Wszyscy gracze płacą Ci czynsz za nieruchomości w jednym z tych dwóch kolorów.';
  return `<article class="card card--rent ${all?'all':''}" data-t="rent">
    <div class="key">
      <div class="rent-head">Karta akcji</div>
      <div class="rent-emblem">${halves}
        <div class="label"><b>CZYNSZ</b>${all?'<i>WSZYSTKIE KOLORY</i>':''}</div>
      </div>
      <p class="effect">${esc(eff)}<i>${esc(r.n)}</i></p>
      <div class="rent-head rent-head--flip">Karta akcji</div>
    </div>
    ${badge(r.v,'badge--action')}
    ${badge(r.v,'badge--rent-b')}
  </article>`;
}

function rulesCard([title, items]){
  return `<article class="card card--rules" data-t="rules">
    <div class="key">
      <div class="rules-title">${esc(title)}</div>
      <ol class="rules-list">${items.map((t,i)=>`<li><b>${i+1}</b><span>${esc(t)}</span></li>`).join('')}</ol>
    </div>
  </article>`;
}

function backCard(){
  return `<article class="card card--back" data-t="back">
    <div class="key">
      <div class="back-dots"></div>
      <div class="wedge wedge--tl"></div>
      <div class="wedge wedge--br"></div>
      <div class="back-center">
        <svg class="arc" viewBox="0 0 100 100">
          <defs>
            <path id="arcT" d="M6,50 a44,44 0 0 1 88,0" fill="none"/>
            <path id="arcB" d="M94,50 a44,44 0 0 1 -88,0" fill="none"/>
          </defs>
          <text font-size="9"><textPath href="#arcT" startOffset="50%" text-anchor="middle">GORIPOLY</textPath></text>
          <text font-size="9"><textPath href="#arcB" startOffset="50%" text-anchor="middle">GORIPOLY</textPath></text>
        </svg>
        <div class="mascot"><img src="bartek.png" alt="Goraj"></div>
      </div>
    </div>
  </article>`;
}

/* =========================== RENDER =========================== */
function slot(html, caption, q){
  q = q || 1;
  let s='';
  for(let i=0;i<q;i++){
    s+=`<figure class="slot ${i?'dup':''}">${html}<figcaption>${esc(caption)}</figcaption></figure>`;
  }
  return s;
}

let out='';
PROPS.forEach(p=>{ out+=slot(propCard(p), p[1], 1); });
WILDS.forEach(w=>{ out+=slot(wildCard(w), `${w[4]} - ${w[3]} szt.`, w[3]); });
out+=slot(wildAllCard(), `${WILD_ALL.n} - ${WILD_ALL.q} szt.`, WILD_ALL.q);
RENTS.forEach(r=>{ out+=slot(rentCard({a:r[0],b:r[1],v:r[2],n:r[4]}), `${r[4]} - ${r[3]} szt.`, r[3]); });
out+=slot(rentCard({all:true,v:RENT_ALL.v,n:RENT_ALL.n}), `${RENT_ALL.n} - ${RENT_ALL.q} szt.`, RENT_ALL.q);
ACTIONS.forEach(a=>{ out+=slot(actionCard(a,'action'), `${a.n} - ${a.q} szt.`, a.q); });
BUILDINGS.forEach(a=>{ out+=slot(actionCard(a,'building'), `${a.n} - ${a.q} szt.`, a.q); });
OOPS.forEach(a=>{ out+=slot(actionCard(a,'oops'), `${a.n} - ${a.q} szt.`, a.q); });
MONEY.forEach(m=>{ out+=slot(moneyCard(m), `${m[0]}M - ${m[1]} szt.`, m[1]); });
RULES.forEach(r=>{ out+=slot(rulesCard(r), r[0]); });
out+=slot(backCard(), 'Rewers - 110 szt.');
document.getElementById('sheet').innerHTML = out;

/* filtry + linie cięcia */
document.querySelectorAll('.bar [data-f]').forEach(b=>{
  b.onclick=()=>{
    document.querySelectorAll('.bar [data-f]').forEach(x=>x.classList.remove('on'));
    b.classList.add('on');
    const f=b.dataset.f;
    document.querySelectorAll('.slot').forEach(s=>{
      const t=s.querySelector('.card').dataset.t;
      s.style.display = (f==='all'||f===t) ? '' : 'none';
    });
  };
});
document.getElementById('g').onclick=()=>document.body.classList.toggle('guides-off');
document.getElementById('dup').onclick=e=>{
  document.body.classList.toggle('all-copies');
  e.target.classList.toggle('on', document.body.classList.contains('all-copies'));
};
</script>
</body>
</html>
